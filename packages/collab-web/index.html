<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#08070b" />

		<title>EROS GATEWAY — a live session, opened to a witness</title>
		<meta
			name="description"
			content="The gateway into a live agent session: streaming transcript, tool cells, the den of subagents — and a composer that speaks to the host. End-to-end encrypted; the room key never leaves the URL fragment."
		/>
		<meta name="author" content="LYCORPEROS" />
		<!-- A private surface, served off a relay with no canonical public host:
		     no canonical link, no sitemap, and nothing for crawlers. -->
		<meta name="robots" content="noindex, nofollow" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
			rel="stylesheet"
		/>

		<link rel="icon" type="image/x-icon" href="./public/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="256x256" href="./public/favicon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="./public/favicon-180x180.png" />
		<link rel="manifest" href="./public/manifest.webmanifest" />

		<!-- Open Graph. The image path is root-relative on purpose: the gateway is
		     served from whatever host holds the relay, so there is no absolute URL
		     to hard-code. -->
		<meta property="og:site_name" content="EROS" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="EROS GATEWAY — a live session, opened to a witness" />
		<meta
			property="og:description"
			content="Witness a live agent session and speak to the host from any browser. End-to-end encrypted; the key stays in the URL fragment."
		/>
		<meta property="og:image" content="/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="EROS GATEWAY" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="EROS GATEWAY — a live session, opened to a witness" />
		<meta
			name="twitter:description"
			content="Witness a live agent session and speak to the host from any browser. End-to-end encrypted; the key stays in the URL fragment."
		/>
		<meta name="twitter:image" content="/og-image.png" />
		<meta name="twitter:image:alt" content="EROS GATEWAY" />

		<!-- Structured data: WebApplication -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "EROS GATEWAY",
				"applicationCategory": "DeveloperApplication",
				"operatingSystem": "Any",
				"description": "The gateway into a live agent session: streaming transcript, tool cells, the den of subagents, and a composer that speaks to the host. End-to-end encrypted.",
				"isPartOf": { "@type": "WebSite", "name": "EROS" }
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
